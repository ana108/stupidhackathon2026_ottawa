<h1 tabindex="0">A user experience that beats pop-ups!</h1>
<h3 tabindex="0">How badly do you want this pizza? Try to click the pay button to see if you can</h3>
<div class="cartPage">
  <div class="item">
    <span>Review Item (1)</span>
    <hr />
    <div class="itemDetails">
      <img src="/pizza.png" />
      <div>
        <h4>Artisanal Pepperoni Pizza</h4>
        <p>Yummy, yummy pizza</p>
        <div class="row pizzaPrice">
          <span>$28.00</span>
          <div class="quantity-stepper" role="group" aria-label="Quantity selector">
            <button type="button" aria-label="Decrease quantity">−</button>
            <span class="quantity-value">1</span>
            <button type="button" aria-label="Increase quantity">+</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="receipt">
    <h3 tabindex="0">Order Summary</h3>
    <div class="row">
      <span tabindex="0">Item Subtotal</span>&nbsp;
      <span>$28.00</span>
    </div>
    <div class="row">
      <span tabindex="0">Shipping</span>&nbsp;
      <span>$0.00</span>
    </div>
    <hr class="separator" />
    <div class="row">
      <span class="bolded" tabindex="0">Total Amount</span>&nbsp;
      <span class="bolded blue">$28.00</span>
    </div>
    <button #evilBtn class="checkoutBtn" (click)="gotIt($event)">Pay Now</button>
  </div>
</div>
<router-outlet />
