name: Deploy to Production
on: 
  push:
    branches:
        - '*'
jobs:
    BuildServer:
      runs-on: ubuntu-latest
      defaults:
        run:
          shell: bash
      env:
        NODE_ENV: production
      steps:
      - uses: actions/checkout@v7
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PRODUCTION_SSH }}
      - name: Copy compose file to server
        run: |
          scp -o StrictHostKeyChecking=no compose.yaml ana@${{ secrets.production_server }}:/home/ana/hackathon_template/
      - name: Set up Docker Buildx (required for secrets/caching)
        uses: docker/setup-buildx-action@v3
      - name: Build backend Docker image with build-arg
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/hackathonbackend:latest 
          outputs: type=docker,dest=/tmp/hackathonbackend.tar
          build-args: |
            NODE_ENV=${{ env.NODE_ENV}}
      - name: Build frontend Docker image with build-arg
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/hackathonfrontend:latest
          outputs: type=docker,dest=/tmp/hackathonfrontend.tar 
          build-args: |
            NODE_ENV=${{ env.NODE_ENV }}
      - name: Copy container images to server
        run: |
          scp -o StrictHostKeyChecking=no /tmp/hackathonbackend.tar /tmp/hackathonfrontend.tar ana@${{ secrets.production_server }}:/home/ana/
    Deploy:
      needs: BuildServer
      runs-on: ubuntu-latest
      defaults:
        run:
          shell: bash
      steps:
      - name: Load docker
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.production_server }}
          username: ana
          key: ${{ secrets.PRODUCTION_SSH }}
          port: 22
          script: |
            docker load -i hackathonfrontend.tar
            docker load -i hackathonbackend.tar
            cd hackathon_template && docker compose up -d --force-recreate